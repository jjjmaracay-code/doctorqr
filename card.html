<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00ff41;
      --red: #ff0000;
      --amber: #ffcc00;
      --bg: #ffffff;
      --card-bg: rgba(255,0,0,0.03);
      --card-border: rgba(0,0,0,0.10);
      --text: #000000;
      --dim: rgba(0,0,0,0.55);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; font-size: 18px; min-height: 100vh; padding-bottom: 90px; }

    /* HEADER */
    .header { background: rgba(255,255,255,0.98); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 12px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,0.1); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .logo { font-size: 11px; font-weight: 900; letter-spacing: 3px; color: #ff0000; text-shadow: 0 0 8px rgba(255,0,0,0.3); }
    .lang-switcher { display: flex; gap: 5px; }
    .lang-btn { background: transparent; border: 1px solid rgba(0,0,0,0.2); color: rgba(0,0,0,0.45); font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 3px 7px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .lang-btn.active { border-color: #ff0000; border-width: 2px; color: #ff0000; background: rgba(255,0,0,0.1); font-weight: 900; text-shadow: 0 0 6px rgba(255,0,0,0.3); }
    .patient-name { font-size: clamp(28px, 7vw, 32px); font-weight: 900; letter-spacing: 2px; color: #000000; line-height: 1.2; margin-bottom: 8px; word-break: break-word; }
    .patient-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .blood-badge { background: var(--red); color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 2px; padding: 8px 20px; border-radius: 8px; box-shadow: 0 0 14px rgba(255,0,0,0.5); }
    .age-badge { font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.6); letter-spacing: 1px; }
    .qr-type-badge { font-size: 9px; letter-spacing: 1px; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); color: rgba(0,0,0,0.35); }
    .ts-note { font-size: 9px; color: rgba(0,0,0,0.25); letter-spacing: 1px; margin-top: 4px; }
    .meta-sutil { font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.65); letter-spacing: 0.3px; margin-top: 4px; line-height: 1.5; }

    /* SEARCH */
    .search-bar { background: rgba(255,255,255,0.98); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 10px 16px; display: flex; align-items: center; gap: 8px; position: sticky; z-index: 99; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .search-input { flex: 1; background: rgba(255,0,0,0.04); border: 1px solid rgba(255,0,0,0.3); color: #ff0000; font-family: inherit; font-size: 14px; letter-spacing: 1px; padding: 7px 12px; border-radius: 6px; outline: none; transition: border-color 0.15s; min-width: 0; }
    .search-input:focus { border-color: #ff0000; box-shadow: 0 0 8px rgba(255,0,0,0.18); }
    .search-input::placeholder { color: rgba(255,0,0,0.35); }
    .search-counter { font-size: 12px; color: var(--dim); white-space: nowrap; min-width: 62px; text-align: center; }
    .search-nav { display: flex; gap: 4px; }
    .nav-btn { background: transparent; border: 1px solid rgba(255,0,0,0.25); color: #ff0000; font-family: inherit; font-size: 16px; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .nav-btn:hover { background: rgba(255,0,0,0.06); }
    .nav-btn:disabled { opacity: 0.22; cursor: default; }
    mark { background: #ffcc00; color: #000; border-radius: 2px; padding: 0 1px; }
    mark.current { background: #ff6600; color: #fff; }

    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.98); position: sticky; z-index: 98; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .tab-btn { flex: 1; background: transparent; border: none; border-bottom: 3px solid transparent; color: rgba(0,0,0,0.45); font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 2px; padding: 14px 6px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { color: #ff0000; border-bottom-color: #ff0000; }

    /* PANELS */
    .tab-panel { display: none; padding: 16px; }
    .tab-panel.active { display: block; }

    /* SECTIONS */
    .section { margin-bottom: 28px; }
    .section-title { font-size: 16px; font-weight: 900; letter-spacing: 3px; color: #ff0000; text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid rgba(255,0,0,0.2); }
    .section-title.red   { color: var(--red);   border-bottom-color: rgba(255,0,0,0.3); }
    .section-title.amber { color: #cc7700;       border-bottom-color: rgba(180,120,0,0.25); }
    .section-title.gray  { color: rgba(0,0,0,0.55); border-bottom-color: rgba(0,0,0,0.12); }

    /* BADGES */
    .badge-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .badge { font-size: 13px; letter-spacing: 0.5px; padding: 7px 14px; border-radius: 6px; font-weight: 700; display: inline-block; margin: 2px 2px 2px 0; }
    .b-red   { background: rgba(255,0,0,0.08);   border: 1px solid rgba(255,0,0,0.5);   color: #cc0000; }
    .b-amber { background: rgba(180,120,0,0.08); border: 1px solid rgba(180,120,0,0.4); color: #8a5e00; }
    .b-green { background: rgba(0,120,0,0.07);   border: 1px solid rgba(0,120,0,0.35);  color: #006600; }
    .b-gray  { background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.18); color: rgba(0,0,0,0.70); }

    /* DATA ROWS */
    .data-row { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.08); align-items: flex-start; }
    .data-row:last-child { border-bottom: none; }
    .data-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--dim); min-width: 130px; padding-top: 1px; flex-shrink: 0; }
    .data-value { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.5; word-break: break-word; }
    .data-value.crit { color: #cc0000; font-weight: 900; }

    /* CONTACTS */
    .contact-card { background: rgba(255,0,0,0.02); border: 1.5px solid rgba(255,0,0,0.15); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .contact-name { font-size: 20px; font-weight: 900; color: #000000; margin-bottom: 4px; }
    .contact-rel  { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: 1px; margin-bottom: 10px; }
    .tel-link { display: inline-block; font-size: 24px; font-weight: 900; color: #ff0000; text-decoration: none; letter-spacing: 1px; }
    .tel-link:hover { color: #cc0000; }
    .tel-sm { font-size: 18px; }
    .tel-link-inline { font-size: inherit; font-weight: 700; display: inline; }

    /* STATES */
    .empty { color: var(--dim); font-size: 11px; letter-spacing: 1px; text-align: center; padding: 24px 0; }
    .error-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; padding: 24px; text-align: center; gap: 16px; }
    .error-icon  { font-size: 56px; color: var(--red); }
    .error-title { font-size: 18px; font-weight: 900; color: #ff0000; letter-spacing: 2px; }
    .error-msg   { font-size: 12px; color: var(--dim); max-width: 280px; line-height: 1.8; }

    /* FOOTER */
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); border-top: 1px solid var(--card-border); padding: 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); }
    .btn-profile { display: block; width: 100%; max-width: 420px; background: var(--green); color: #000; font-family: inherit; font-size: 11px; font-weight: 900; letter-spacing: 3px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; text-align: center; text-decoration: none; transition: opacity 0.15s; }
    .btn-profile:hover { opacity: 0.85; }
    .footer-note { font-size: 9px; color: var(--dim); letter-spacing: 1px; }
    .minimal-banner { background: rgba(255,165,0,0.12); border: 1px solid rgba(255,165,0,0.4); border-radius: 8px; padding: 10px 14px; font-size: 10px; letter-spacing: 0.5px; color: #ffaa00; text-align: center; margin: 0 0 12px; line-height: 1.5; }

    .scroll-indicator {
      position: fixed;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ff2222;
      color: #fff;
      border: none;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255,34,34,0.6);
      z-index: 950;
      display: none;
      align-items: center;
      justify-content: center;
      animation: scrollIndPulse 1.6s ease-in-out infinite;
    }
    .scroll-indicator.visible { display: flex; }
    .scroll-indicator-down { bottom: 20px; }
    .scroll-indicator-up { top: 66px; }
    @keyframes scrollIndPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

// ================================================================
// Helpers
// ================================================================
Object.entries(window.AtabeyQrLanguages || {}).forEach(([code, dictionary]) => {
  T[code] = Object.assign({}, T.es, T[code] || {}, dictionary);
  T[code].results = (n,total) => n + ' / ' + total;
});
function qrLanguageControl() {
  const names={es:'Español',en:'English',fr:'Français',de:'Deutsch',pt:'Português',eu:'Euskara',hi:'हिन्दी',zh:'简体中文',ru:'Русский',ja:'日本語',ar:'العربية'};
  return '<select class="qr-language-select" aria-label="' + escAttr(t.language || 'Language') + '" onchange="setLang(this.value)">' + Object.keys(names).filter(code=>T[code]).map(code=>'<option value="'+code+'"'+(code===lang?' selected':'')+'>'+names[code]+'</option>').join('') + '</select>';
}

function clinicalText(value) {
  if (value === undefined || value === null) return '';
  if (Array.isArray(value)) return value.map(clinicalText).filter(Boolean).join(', ');
  if (typeof value === 'object') return Object.entries(value).map(([key,item]) => key + ': ' + clinicalText(item)).join('; ');
  return String(value);
}
function esc(s) {
  return clinicalText(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function arr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(Boolean);
  return [v];
}

function calcAge(ds) {
  if (!ds) return null;
  const d = window.AtabeyDates?.parse(ds);
  if (!d) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getUTCFullYear();
  if (now.getMonth() < d.getUTCMonth() || (now.getMonth() === d.getUTCMonth() && now.getDate() < d.getUTCDate())) age--;
  return age >= 0 ? age : null;
}

function isCrit(v) {
  if (typeof v !== 'string' || !v) return false;
  const u = v.toUpperCase();
  return u.startsWith('SÍ') || u.startsWith('SI ') || u === 'SI' ||
         u.includes('YES') || u.includes('CONFIRMAD') ||
         u.includes('DIFÍCIL') || u.includes('DIFICIL');
}

// ================================================================
// Render helpers
// ================================================================
function section(title, body, color) {
  if (!body) return '';
  return `<div class="section"><div class="section-title ${color||''}">${title}</div>${body}</div>`;
}

function badges(items, cls) {
  if (!items.length) return '';
  return `<div class="badge-list">${items.map(i => `<span class="badge ${cls}" dir="auto">${esc(i)}</span>`).join('')}</div>`;
}

function row(label, val, crit) {
  if (val === undefined || val === null || clinicalText(val).trim() === '') return '';
  return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value${crit ? ' crit' : ''}">${esc(val)}</span></div>`;
}

function badgeRow(label, items, cls) {
  if (!items.length) return '';
  return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value" dir="auto">${items.map(i => `<span class="badge ${cls}" dir="auto">${esc(i)}</span>`).join('')}</span></div>`;
}

function objRow(label, obj) {
  if (obj !== null && obj !== undefined && (typeof obj !== 'object' || Array.isArray(obj))) return row(label,obj);
  if (!obj || !Object.keys(obj).length) return '';
  const items = Object.entries(obj).map(([k, v]) => `${k}: ${clinicalText(v)}`).join(', ');
  return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value" dir="auto">${esc(items)}</span></div>`;
}

function telRow(label, tel, cls) {
  if (!tel) return '';
  return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value" dir="auto"><a class="tel-link ${cls||''}" href="tel:${escAttr(tel)}">${esc(tel)}</a></span></div>`;
}

  return [...new Set([...(priority || []),...Object.keys(parts)])].map(key=>parts[key] || '').join('');

let trialReaderClock = null;
let trialReaderTimer = null;
function checkReaderTrial() {
  clearTimeout(trialReaderTimer);
  if (!trialReaderClock) return;
  const elapsed = Math.max(Date.now()-trialReaderClock.wall,performance.now()-trialReaderClock.mono);
  const remaining = trialReaderClock.seconds*1000-elapsed;
  if (remaining <= 0) {
    trialReaderClock=null;data=null;searchMatches=[];searchCurrent=-1;readingMode=false;
    document.body.classList.remove('qr-reading-mode');window.cardLoadProblem='trial_expired';renderError();
  } else trialReaderTimer=setTimeout(checkReaderTrial,Math.min(60000,remaining));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReaderTrial();});

function detectLang() {
  let preference='';
  try { preference=localStorage.getItem('doctorqr_qr_language') || ''; } catch (_) {}
  if (T[preference]) return preference;
  const l = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return T[l] ? l : 'es';
}

const BACKEND = 'https://doctorqr-backend-production.up.railway.app';

async function parseData() {
  window.cardLoadProblem = 'invalid';
  try {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id || params.getAll('id').length !== 1) return null;
    window.cardLoadProblem = 'connection';
    const requestedAt=Date.now(),requestedMono=performance.now();
    const res = await fetch(`${BACKEND}/api/profile/load?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
    if (!res.ok) {
      window.cardLoadProblem = res.status === 402 ? 'trial_expired' : res.status === 404 ? 'unpublished' : res.status === 409 ? 'verification' : res.status === 429 ? 'limited' : 'unavailable';
      return null;
    }
    const result = await res.json();
    if (result.doctorqr_id !== id || !result.profile || typeof result.profile !== 'object') { window.cardLoadProblem = 'verification'; return null; }
    const current = new URLSearchParams(window.location.search);
    if (current.getAll('id').length !== 1 || current.get('id') !== id ||
        (result.profile._profile_owner !== undefined && result.profile._profile_owner !== id) ||
        (result.profile.doctorqr_id !== undefined && result.profile.doctorqr_id !== id)) { window.cardLoadProblem = 'verification'; return null; }
    window.cardLoadProblem = '';
    if (Array.isArray(result.profile)) { window.cardLoadProblem = 'verification'; return null; }
    if (result.access_status?.status === 'trial_active' && Number.isFinite(result.access_status.remaining_seconds)) {
      const elapsed=Math.max(Date.now()-requestedAt,performance.now()-requestedMono);
      const remaining=result.access_status.remaining_seconds*1000-elapsed;
      if(remaining<=0){window.cardLoadProblem='trial_expired';return null;}
      trialReaderClock={seconds:result.access_status.remaining_seconds,wall:requestedAt,mono:requestedMono};
      trialReaderTimer=setTimeout(checkReaderTrial,Math.min(60000,remaining));
    }
    return { ...result.profile, _qr_type: params.get('t') || '', _published_at:result.updated_at || null };
  } catch (_) { return null; }
}

      const atBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 10);
      down.classList.toggle('visible', atTop && !atBottom);
      up.classList.toggle('visible', atBottom && !atTop);
    }

    down.addEventListener('click', () => window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' }));
    up.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', updateScrollIndicators);
    window.addEventListener('resize', updateScrollIndicators);
    updateScrollIndicators();
  })();
}

// Presentation only: the same confirmed medical nodes remain in place.
function setReadingMode(expanded) {
  if (!data) return;
  readingMode = !!expanded;
  document.body.classList.toggle('qr-reading-mode',readingMode);
  document.getElementById('reader-expand')?.setAttribute('aria-expanded',String(readingMode));
  positionSticky();
  window.scrollTo({top:0,behavior:'instant'});
  document.getElementById(readingMode ? 'reader-back' : 'reader-expand')?.focus({preventScroll:true});
}
function observeReaderLayout() {
  readerLayoutObserver?.disconnect();
  if (window.ResizeObserver) {
    readerLayoutObserver = new ResizeObserver(positionSticky);
    for (const selector of ['#sbar','#tabs','.footer']) {
      const element=document.querySelector(selector);if(element)readerLayoutObserver.observe(element);
    }
  }
  positionSticky();
}
function positionSticky() {
  requestAnimationFrame(() => {
    const sbar=document.getElementById('sbar'),tabs=document.getElementById('tabs'),footer=document.querySelector('.footer');
    if (!sbar || !tabs) return;
    sbar.style.top='0px';
    tabs.style.top=sbar.offsetHeight+'px';
    document.body.style.setProperty('--reader-sticky-offset',(sbar.offsetHeight+(readingMode?0:tabs.offsetHeight))+'px');
    document.body.style.setProperty('--reader-footer-size',(footer?.offsetHeight||0)+'px');
  });
}
window.addEventListener('resize',positionSticky);
window.visualViewport?.addEventListener('resize',positionSticky);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && !event.defaultPrevented && readingMode){event.preventDefault();setReadingMode(false);}
});

// ================================================================
// Control de acceso por dispositivo: ventana de 24h desde la primera
// vista de ESTA tarjeta en ESTE dispositivo/navegador.
//
// LIMITACIÓN CONOCIDA (documentada a propósito, no oculta): esta
// ventana vive en el localStorage de este dispositivo — es evitable
// borrando datos de navegación o usando modo incógnito. Es una barrera
// de privacidad razonable para el caso normal (que un médico/
// paramédico no vuelva a consultar los datos de un paciente pasado un
// día sin motivo), NO una garantía de seguridad absoluta.
//
// Es TOTALMENTE INDEPENDIENTE de la validez del QR/URL en sí: el
// código físico impreso sigue funcionando para siempre. Cualquier OTRO
// dispositivo que lo escanee obtiene su propia ventana de 24h desde
// cero — nunca se bloquea el QR, solo el acceso repetido desde un
// mismo dispositivo ya usado.
//
// La clave incluye tanto `id` como `t` (tipo de QR): cada uno de los 9
// tipos de tarjeta (qr-emergency, qr-u1, qr-u2...) es un código físico
// impreso distinto, así que cada uno lleva su propia ventana de 24h
// independiente en este dispositivo, aunque sean del mismo paciente.
// Este chequeo vive en el boot común (antes de renderApp()), no
// duplicado por tipo — aplica igual a los 9 sin excepción.
function verificarAccesoVigente() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return true; // formato legacy sin id — fuera del alcance de este control

  const t = params.get('t') || '';
  const key = `card_first_view_${id}_${t}`;
  const ahora = Date.now();
  const primeraVista = localStorage.getItem(key);

  if (!primeraVista) {
    // Primera vez que este dispositivo ve esta tarjeta concreta —
    // arranca la ventana de 24h y deja pasar. No se vuelve a tocar
    // esta clave mientras siga vigente: la ventana no se alarga con
    // cada recarga, sigue contando desde esta primera vista.
    localStorage.setItem(key, String(ahora));
    return true;
  }

  const VENTANA_MS = 24 * 60 * 60 * 1000;
  return (ahora - parseInt(primeraVista, 10)) < VENTANA_MS;
}

// ================================================================
// Tab switching
// ================================================================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tbtn-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  activeTab = name;
}

// ================================================================
// Search
// ================================================================
function initSearch() {
  const inp  = document.getElementById('sinput');
  const prev = document.getElementById('sprev');
  const next = document.getElementById('snext');
  if (!inp) return;

  inp.addEventListener('input', () => runSearch(inp.value));
  prev.addEventListener('click', () => navigate(-1));
  next.addEventListener('click', () => navigate(1));
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowUp')  { e.preventDefault(); navigate(-1); }
    if (e.key === 'Escape') { e.preventDefault();if(inp.value){inp.value='';runSearch('');}else if(readingMode)setReadingMode(false);else inp.blur(); }
  });
}

function getTextNodes(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walker.nextNode())) {
    if (n.nodeValue.trim()) nodes.push(n);
  }
  return nodes;
}

function clearMarks() {
  document.querySelectorAll('.tab-panel mark').forEach(m => {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
}

function normalize(str) {
  return str.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function runSearch(q) {
  clearMarks();
  searchMatches = [];
  searchCurrent = -1;
  updateCounter();
  const prev = document.getElementById('sprev');
  const next = document.getElementById('snext');

  if (!q || q.length < 1) {
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
    return;
  }

  const ql = normalize(q.toLowerCase());
  document.querySelectorAll('.tab-panel').forEach(panel => {
    getTextNodes(panel).forEach(node => {
      const txt = node.nodeValue;
      const low = normalize(txt.toLowerCase());
      let idx = low.indexOf(ql);
      if (idx === -1) return;
      const frag = document.createDocumentFragment();
      let last = 0;
      while (idx !== -1) {
        if (idx > last) frag.appendChild(document.createTextNode(txt.slice(last, idx)));
        const mk = document.createElement('mark');
        mk.textContent = txt.slice(idx, idx + ql.length);
        frag.appendChild(mk);
        searchMatches.push(mk);
        last = idx + ql.length;
        idx = low.indexOf(ql, last);
      }
      if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  });

  if (searchMatches.length) {
    searchCurrent = 0;
    highlight();
    if (prev) prev.disabled = false;
    if (next) next.disabled = false;
  } else {
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
  }
  updateCounter();
}

function navigate(dir) {
  if (!searchMatches.length) return;
  searchCurrent = (searchCurrent + dir + searchMatches.length) % searchMatches.length;
  highlight();
  updateCounter();
}

function highlight() {
  searchMatches.forEach((m, i) => m.classList.toggle('current', i === searchCurrent));
  const cur = searchMatches[searchCurrent];
  if (!cur) return;
  const panel = cur.closest('.tab-panel');
  if (panel) {
    const id = panel.id.replace('panel-', '');
    if (id !== activeTab) switchTab(id);
  }
  requestAnimationFrame(() => {
    if (!cur.isConnected) return;
    const bar=document.getElementById('sbar'),tabs=document.getElementById('tabs');
    const top=Math.max(bar?.getBoundingClientRect().bottom||0,readingMode?0:tabs?.getBoundingClientRect().bottom||0)+12;
    const bounds=cur.getBoundingClientRect(),visibleHeight=window.visualViewport?.height||window.innerHeight;
    if(bounds.top<top || bounds.bottom>visibleHeight-12)window.scrollTo({top:Math.max(0,window.scrollY+bounds.top-top),behavior:'instant'});
  });
}

function updateCounter() {
  const el  = document.getElementById('sctr');
  const inp = document.getElementById('sinput');
  if (!el) return;
  const feedback=document.getElementById('search-feedback');
  if(feedback)feedback.hidden=!(searchMatches.length || (inp && inp.value.length>=2));
  positionSticky();
  if (!searchMatches.length) {
    el.textContent = inp && inp.value.length >= 2 ? t.no_results : '';
    return;
  }
  el.textContent = t.results(searchCurrent + 1, searchMatches.length);
}

// ================================================================
// Language switch
// ================================================================
function setLang(l) {
  if (!T[l]) return;
  const prevQ = document.getElementById('sinput')?.value || '';
  const prevTab = activeTab;
  lang = l;
  try { localStorage.setItem('doctorqr_qr_language', l); } catch (_) {}
  t    = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  if (!data) { renderError(); return; }
  renderApp();
  if (prevTab !== 'urgente') switchTab(prevTab);
  if (prevQ.length >= 2) {
    const inp = document.getElementById('sinput');
    if (inp) { inp.value = prevQ; runSearch(prevQ); }
  }
}

// ================================================================
// Boot
// ================================================================
lang = detectLang();
t    = T[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang === 'ar' ? 'rtl' : 'ltr';
parseData().then(d => {
  data = d;
  if (!data) { renderError(); return; }
  // El acceso real siempre gana: la ventana de 24h ya no bloquea el
  // contenido médico, solo decide si se muestra el aviso informativo.
  accesoVigente = verificarAccesoVigente();
  renderApp();
});
</script>
