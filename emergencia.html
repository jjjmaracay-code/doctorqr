<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Atabeyapp — Acceso rápido de emergencia</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#fff;font-family:'Courier New',Courier,monospace;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;text-align:center}
    .box{max-width:380px}
    .logo{font-size:14px;font-weight:900;letter-spacing:3px;color:#12A5FF;
      text-shadow:0 0 8px #12A5FF;margin-bottom:20px}
    .logo span{opacity:0.4}
    h1{font-size:16px;font-weight:900;color:#fff;letter-spacing:0.5px;
      margin-bottom:12px;line-height:1.4}
    p{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:20px}
    a.btn{display:inline-block;background:#12A5FF;color:#000;font-weight:900;
      text-decoration:none;padding:12px 26px;border-radius:8px;font-size:13px;
      letter-spacing:0.5px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">ATABEY<span>APP</span></div>
    <div id="msg">
      <h1>Cargando tu Acceso Rápido de Emergencia&hellip;</h1>
    </div>
  </div>

  <!-- Contenedor de la vista de cuadrícula del Acceso Rápido de Emergencia
       (renderEmergencyQuickView(), en js/qr-generator.js) -->
  <div id="emergency-quick-view" style="display:none"></div>

  <script src="js/qr-generator.js"></script>
  <script>
    // handleEmergencyQuickAccess() vive en js/qr-generator.js, compartida
    // con login.html e index.html -- si no hay perfil local, ella misma
    // rellena #msg con el aviso y el enlace de vuelta a login.html.
    handleEmergencyQuickAccess();
  </script>
</body>
</html>
