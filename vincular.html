</head><body data-link-page="approve"><main style="max-width:600px"><a class="brand" href="/index.html">ATABEYAPP</a><h1>¿Autorizar este ordenador?</h1><section class="panel"><p class="account" id="link-account"></p><p id="browser-label"></p><p>El número debe coincidir con el que aparece en el ordenador que tienes delante.</p><div id="confirmation" class="confirmation">—</div><p class="warning">Concederás acceso para consultar y editar tu historial médico. No autorices solicitudes que te envíe otra persona.</p><form id="approve-form"><label class="field">Número que aparece en tu ordenador<input id="confirmation-input" class="code-input" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required></label><label class="field">Código de tu autenticador<input id="totp-input" class="code-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><label><input id="approval-check" type="checkbox" required style="width:auto;min-height:auto"> Reconozco el ordenador y autorizo el acceso a mi historial.</label><div class="actions"><button id="approve-button" type="submit" disabled>Autorizar acceso</button><a href="/dispositivos.html" class="button secondary">Cancelar</a></div></form><div id="link-status" class="status" role="status" aria-live="polite">Comprobando solicitud…</div></section></main></body></html>
